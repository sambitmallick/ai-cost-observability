# Prometheus scrapes the app's /metrics every 5 s. Data on a volume: v1 and v2 load tests must both survive restarts.
apiVersion: v1
kind: ConfigMap
metadata: { name: prometheus-config, namespace: ai-cost }
data:
  prometheus.yml: |
    global: { scrape_interval: 5s }
    scrape_configs:
      - job_name: ci-copilot
        static_configs: [{ targets: ["ci-copilot:8080"] }]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: prometheus-data, namespace: ai-cost }
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 2Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: prometheus, namespace: ai-cost }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: prometheus } }
  template:
    metadata: { labels: { app: prometheus } }
    spec:
      securityContext: { fsGroup: 65534 }
      containers:
        - name: prometheus
          image: docker.io/prom/prometheus:v3.15.0
          imagePullPolicy: Never
          args: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--storage.tsdb.retention.time=30d"]
          ports: [{ containerPort: 9090 }]
          volumeMounts:
            - { name: config, mountPath: /etc/prometheus }
            - { name: data, mountPath: /prometheus }
      volumes:
        - { name: config, configMap: { name: prometheus-config } }
        - { name: data, persistentVolumeClaim: { claimName: prometheus-data } }
---
apiVersion: v1
kind: Service
metadata: { name: prometheus, namespace: ai-cost }
spec:
  selector: { app: prometheus }
  ports: [{ port: 9090 }]
