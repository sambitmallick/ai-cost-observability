# CI Copilot v2: the same app, with the fixes the v1 dashboard pointed at. One replica: the response cache and the chat sessions live in its memory.
# The API key comes from a Secret created from a local file (never from this repo):
#   kubectl -n ai-cost create secret generic anthropic --from-file=api-key=$HOME/.anthropic/ep31.key
apiVersion: apps/v1
kind: Deployment
metadata: { name: ci-copilot, namespace: ai-cost }
spec:
  replicas: 1
  selector: { matchLabels: { app: ci-copilot } }
  template:
    metadata: { labels: { app: ci-copilot } }
    spec:
      containers:
        - name: app
          image: localhost/ci-copilot:1.1
          imagePullPolicy: Never
          ports: [{ containerPort: 8080 }]
          env:
            - { name: APP_VERSION, value: "v2" }
            # 1. 74% of answers were cut off: thinking counts toward max_tokens. Room for it, and less of it:
            #    effort "low" for the short features (the docs' advice for chat and simple requests), medium for fix
            - { name: MAX_TOKENS, value: '{"explain": 1500, "summarize": 3000, "chat": 1500, "fix": 4000}' }
            - { name: EFFORT, value: '{"explain": "low", "chat": "low", "fix": "medium"}' }
            # 2. two pastes crossed 100k tokens and paid 5x: count first (free), trim to the error lines and the end
            - { name: PROMPT_LIMIT, value: "90000" }
            # 3. the response cache hit 6.8%: a re-run of the same failure only differs in its timestamps
            - { name: CACHE_KEY, value: "no-timestamps" }
            # 4. every chat turn resends the whole conversation: let the next turn read it from the prompt cache
            - { name: CHAT_HISTORY_CACHE, value: "on" }
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://jaeger:4318" }
            - name: ANTHROPIC_API_KEY
              valueFrom: { secretKeyRef: { name: anthropic, key: api-key } }
          readinessProbe: { httpGet: { path: /healthz, port: 8080 }, periodSeconds: 5 }
          resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { memory: 512Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: ci-copilot, namespace: ai-cost }
spec:
  selector: { app: ci-copilot }
  ports: [{ port: 8080 }]
